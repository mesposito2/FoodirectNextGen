# Foodirect web (ASP.NET MVC 5 / .NET Framework 4.8) - build, test, deploy to IIS on an Azure VM.
#
#  pull_request -> main : build + test only, on GitHub-hosted runners. Read-only token; never touches the VM.
#  push         -> main : build + test, publish, upload artifact, then the VM's self-hosted runner deploys
#                         THAT artifact (staging check -> switch -> production check -> auto-rollback),
#                         then a GitHub-hosted job checks the public URL.
#
# Required GitHub configuration (see README section 4):
#   Environment "production" (deployment branches: main only) with variables IIS_SITE_NAME, PRODUCTION_URL,
#   and optionally STAGING_PORT (default 8088) and LOCAL_HEALTH_URL.
#   No secrets are stored in GitHub. App secrets live on the VM in C:\Foodirect\shared\config.

name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Default for every job: read-only repo access, no id-token (=> no Azure login possible).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a deployment mid-flight.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CONFIGURATION: Release
  SOLUTION: V5.Web.slnf
  TEST_PROJECT: Tests/FoodirectV5.Tests/FoodirectV5.Tests.csproj
  WEB_PROJECT: UI/UI.csproj
  ARTIFACT_NAME: foodirect-web

jobs:
  build-test:
    name: Build & test
    # .NET Framework 4.8 + legacy web targets need Windows + Visual Studio MSBuild.
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK (from global.json, runs the test project)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            packages
            ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.config', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: msbuild ${{ env.SOLUTION }} /t:Restore /p:RestorePackagesConfig=true /p:Configuration=${{ env.CONFIGURATION }} /nologo /v:m

      - name: Build (Release)
        # RestorePackages=false: skip the legacy NuGet.exe 2.6 restore baked into UI.csproj (done above instead)
        run: msbuild ${{ env.SOLUTION }} /p:Configuration=${{ env.CONFIGURATION }} /p:RestorePackages=false /m /nologo /v:m

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT }} --no-build -c ${{ env.CONFIGURATION }} --logger trx --results-directory TestResults

      - name: Compile all Razor views (catches view errors the C# build misses)
        shell: pwsh
        run: |
          $compiler = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\aspnet_compiler.exe"
          & $compiler -v / -p "$env:GITHUB_WORKSPACE\UI" -f "$env:RUNNER_TEMP\precompiled" -nologo
          if ($LASTEXITCODE -ne 0) { throw "Razor view compilation failed" }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
          if-no-files-found: ignore

      # ---------- main only: publish once, deploy that exact output ----------
      - name: Publish web project (Web.Release.config applied)
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $pkg = Join-Path $env:GITHUB_WORKSPACE "artifacts\package"
          $out = Join-Path $pkg "site"
          msbuild ${{ env.WEB_PROJECT }} /p:Configuration=${{ env.CONFIGURATION }} /p:DeployOnBuild=true `
            /p:PublishProfile=CI-Folder /p:PublishUrl="$out" /p:RestorePackages=false /nologo /v:m
          if ($LASTEXITCODE -ne 0) { throw "publish failed" }
          # Stamp the build so the live site can be traced back to the commit.
          "commit=${{ github.sha }}`nrun=${{ github.run_id }}`nbuilt=$(Get-Date -AsUTC -Format o)" | Set-Content "$out\version.txt"
          # Ship the deploy scripts with the build, so the VM never needs a git checkout.
          Copy-Item deploy -Destination (Join-Path $pkg "deploy") -Recurse
          Get-ChildItem $pkg -Recurse -Depth 1 | Select-Object FullName

      - name: Upload publish artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/package
          if-no-files-found: error
          retention-days: 30

  deploy:
    name: Deploy to IIS VM
    needs: build-test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    # The self-hosted runner installed on the VM by deploy/vm-setup.ps1. PR jobs never run here.
    runs-on: [self-hosted, windows, foodirect-iis]
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    # No id-token and no cloud credentials: the runner already lives on the target server and talks
    # outbound to GitHub only. The job token is short-lived and read-only.
    permissions:
      contents: read
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Download publish artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ runner.temp }}\foodirect-${{ github.run_id }}

      - name: Install release (staging check, switch, production check, auto-rollback)
        shell: powershell
        run: |
          $pkg = "${{ runner.temp }}\foodirect-${{ github.run_id }}"
          $port = "${{ vars.STAGING_PORT }}"; if (-not $port) { $port = 8088 }
          & "$pkg\deploy\iis-deploy.ps1" -PackagePath "$pkg\site" -SiteName "${{ vars.IIS_SITE_NAME }}" `
            -StagingPort $port -CommitSha "${{ github.sha }}" -HealthUrl "${{ vars.LOCAL_HEALTH_URL }}"

      - name: Clean up downloaded package
        if: always()
        shell: powershell
        run: Remove-Item "${{ runner.temp }}\foodirect-${{ github.run_id }}" -Recurse -Force -ErrorAction SilentlyContinue

  verify-public:
    name: Verify public site
    needs: deploy
    if: vars.PRODUCTION_URL != ''
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check /health from the internet and print the deployed commit
        run: |
          base="${{ vars.PRODUCTION_URL }}"
          echo "Checking $base/health"
          curl --fail --silent --show-error --retry 6 --retry-delay 10 --retry-all-errors --max-time 60 "$base/health"
          echo
          deployed=$(curl --silent --max-time 30 "$base/version.txt" | head -1)
          echo "Live: $deployed  (expected commit=${{ github.sha }})"
          [ "$deployed" = "commit=${{ github.sha }}" ] || { echo "::error::Live site is not serving this commit"; exit 1; }
